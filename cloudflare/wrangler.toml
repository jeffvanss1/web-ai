name = "spotube-dj"
main = "src/index.ts"
compatibility_date = "2026-08-31"

[vars]
# Store the YouTube Data API key as a secret for production:
# npx wrangler secret put YOUTUBE_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "spotube-dj"
database_id = "replace-with-d1-database-id"
migrations_dir = "migrations"

[durable_objects]
bindings = [
  { name = "USER_QUEUE", class_name = "UserQueue" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserQueue"]

[assets]
directory = "../web"
binding = "ASSETS"

[observability]
enabled = true
